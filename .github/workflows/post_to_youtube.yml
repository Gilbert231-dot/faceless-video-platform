name: Post to YouTube

on:
  push:
    paths:
      - "videos/ready/*.mp4"
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check if videos exist (skip if none)
        id: check
        run: |
          if [ -z "$(ls -A videos/ready/*.mp4 2>/dev/null)" ]; then
            echo "has_videos=false" >> $GITHUB_OUTPUT
            echo "No videos found, skipping upload."
          else
            echo "has_videos=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Checkout code
        if: steps.check.outputs.has_videos == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.check.outputs.has_videos == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.has_videos == 'true'
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Upload videos to YouTube
        if: steps.check.outputs.has_videos == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for video in videos/ready/*.mp4; do
            if [ -f "$video" ]; then
              echo "📤 Uploading: $video"
              metadata="${video%.mp4}_metadata.json"
              python -c "import os; from youtube_uploader import upload_to_youtube; metadata_path='$metadata' if os.path.exists('$metadata') else None; upload_to_youtube('$video', metadata_path=metadata_path, privacy_status='public')"
              mkdir -p videos/done
              mv "$video" videos/done/
              if [ -f "$metadata" ]; then
                mv "$metadata" videos/done/
              fi
            fi
          done
