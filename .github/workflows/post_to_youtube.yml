name: Post to YouTube

on:
  push:
    paths:
      - "videos/ready/*.mp4"
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check if posting is enabled
        id: check_posting
        run: |
          if [ -f POSTING_ENABLED ] && grep -q "true" POSTING_ENABLED; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ Posting is paused. To enable, set POSTING_ENABLED to 'true'."
          fi

      - name: Set up Python
        if: steps.check_posting.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check_posting.outputs.enabled == 'true'
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Upload videos to YouTube
        if: steps.check_posting.outputs.enabled == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for video in videos/ready/*.mp4; do
            if [ -f "$video" ]; then
              echo "📤 Uploading: $video"
              metadata="${video%.mp4}_metadata.json"
              python -c "import os; from youtube_uploader import upload_to_youtube; metadata_path='$metadata' if os.path.exists('$metadata') else None; upload_to_youtube('$video', metadata_path=metadata_path, privacy_status='public')"
              mkdir -p videos/done
              mv "$video" videos/done/
              if [ -f "$metadata" ]; then
                mv "$metadata" videos/done/
              fi
            fi
          done
