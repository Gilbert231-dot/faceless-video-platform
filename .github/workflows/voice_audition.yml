name: Voice audition (reference A/B)

# Not part of the daily pipeline and never scheduled: it is dispatched by hand to
# answer one question — which voice source sounds least robotic? It speaks the SAME
# paragraph with every variant below, so only the voice changes between samples:
#
#   1 installed Brian reference, turbo model        (what the pipeline uses today)
#   2 processed TikTok cut, turbo                   (the loudnorm'd cut)
#   3 raw TikTok cut, turbo                          (no filtering at all)
#   4 raw TikTok cut from a different window, turbo
#   5 no reference at all, turbo                     (the model's stock voice)
#   6 raw TikTok cut, standard model                 (bigger, slower, livelier)
#
# 1.10x speed is NOT applied here: video_compile.py does that with atempo at render
# time, so these are all natural pace.
#
# Why not run this locally? The clone models are ~1 GB from the Hugging Face Hub, and
# the cache this repo already keeps (hf-chatterbox-*, restored below) makes the
# runner's start-up a couple of minutes instead of an overnight download.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Short label for the artifact'
        required: false
        default: 'v2'

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # make_voice_ref.py profiles a clip through ffmpeg's aspectralstats filter and
      # tts_local.py encodes the mp3 with it. generate_video.yml installs it for the
      # same reason; without it every reference here "could not be profiled" in about
      # 30 ms, because the profile helper finds no binary and gives up silently.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache the local voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-${{ hashFiles('requirements-tts.txt') }}

      - name: Install the local voice engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tts.txt
          python - <<'PY'
          import torch, chatterbox, tts_local
          from perth import PerthImplicitWatermarker
          assert PerthImplicitWatermarker is not None, (
              "perth's watermarker is unavailable - it imports pkg_resources, so this "
              "environment has setuptools>=81. requirements-tts.txt pins setuptools<81.")
          print("local voice engine ready:", torch.__version__)
          PY

      - name: Check every reference holds speech
        run: |
          python make_voice_ref.py --check
          for c in assets/voices/_candidates/*.wav; do
            echo "== $c"
            TTS_REF_MALE="$PWD/$c" python make_voice_ref.py --check
          done

      - name: Speak the paragraph with every variant
        env:
          SCRIPT: 'The nurse said my mother had been asking for me every night. I had not spoken to her in eleven years. I told myself I was ready for whatever she had to say. I was not.'
        run: |
          mkdir -p out
          say () {
            # $1 = output name, $2 = reference clip ("none" = model's own voice),
            # $3 = model (turbo | standard)
            out="$1"; ref="$2"; model="$3"
            if [ "$ref" = "none" ]; then
              TTS_MODEL="$model" TTS_REF_MALE=/tmp/no-such-voice.wav \
                python tts_local.py --text "$SCRIPT" --voice male --out "out/$out"
            else
              TTS_MODEL="$model" TTS_REF_MALE="$PWD/$ref" \
                python tts_local.py --text "$SCRIPT" --voice male --out "out/$out"
            fi
          }
          say 1_installed_turbo.mp3  assets/voices/male.wav                              turbo
          say 2_tiktok_turbo.mp3     assets/voices/_candidates/tiktok_male_35s.wav      turbo
          say 3_raw35_turbo.mp3      assets/voices/_candidates/tiktok_raw_35s.wav       turbo
          say 4_raw20_turbo.mp3      assets/voices/_candidates/tiktok_raw_20s.wav       turbo
          say 5_stock_turbo.mp3      none                                               turbo
          say 6_raw35_standard.mp3   assets/voices/_candidates/tiktok_raw_35s.wav       standard
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: voice-audition-${{ inputs.label }}
          path: out/*.mp3
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Voice audition v2"
            echo ""
            echo "Same paragraph, same pace, six voice sources."
            echo ""
            echo "| # | reference | model |"
            echo "|---|---|---|"
            echo "| 1 | installed Brian | turbo |"
            echo "| 2 | processed TikTok cut | turbo |"
            echo "| 3 | raw TikTok cut | turbo |"
            echo "| 4 | raw TikTok, other window | turbo |"
            echo "| 5 | none (stock voice) | turbo |"
            echo "| 6 | raw TikTok cut | standard |"
          } >> "$GITHUB_STEP_SUMMARY"
