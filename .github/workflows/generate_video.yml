name: Generate Faceless Videos

on:
  schedule:
    - cron: "0 2 * * *"   # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: true
        default: '2'
        type: string
      test_mode:
        description: 'Test mode (does NOT mark stories as used)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write   # needed to push videos/state back to the repo
  actions: write    # needed to dispatch the upload workflow via gh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-server postgresql postgresql-contrib \
                                  mpg123 sox lame unzip tree

      - name: Start Redis & PostgreSQL
        run: |
          sudo service redis-server start
          sudo service postgresql start

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> $GITHUB_ENV
          # DEBUG_MODE is read by config.py / tasks.py. Test mode => True (stories NOT consumed).
          echo "DEBUG_MODE=${{ inputs.test_mode == 'true' && 'True' || 'False' }}" >> $GITHUB_ENV
          echo "FAST_MODE=True" >> $GITHUB_ENV
          # CRF 18 for BOTH the background video (video_compile.py) and the
          # caption burn (caption_utils.py). preset=veryfast keeps encoding
          # fast — CRF controls quality, the preset controls speed. Raise
          # VIDEO_CRF to ~23-25 (or set count=1) if you still hit timeouts.
          echo "VIDEO_CRF=18" >> $GITHUB_ENV
          echo "VIDEO_PRESET=veryfast" >> $GITHUB_ENV
          # compile_video()/caption_utils read OUTPUT_DIR from the environment.
          # Without it, videos land in the repo root and every output/* glob
          # (upload step, cleanup) silently misses them.
          echo "OUTPUT_DIR=output" >> $GITHUB_ENV

      - name: Unzip reddit stories
        run: |
          if [ -f reddit_stories.zip ]; then
            echo "📦 Found reddit_stories.zip. Extracting..."

            # Remove any existing reddit_stories folder to avoid conflicts
            rm -rf reddit_stories

            # Extract the zip directly
            unzip -o reddit_stories.zip

            # If the zip extracted a `reddit_stories` folder, move its contents up
            if [ -d reddit_stories ]; then
              echo "📂 Found nested reddit_stories folder, moving contents up..."
              mv reddit_stories/* ./
              rm -rf reddit_stories
            fi

            # Now ensure all subdirectories are inside reddit_stories/
            mkdir -p reddit_stories
            for sub in AITAH AmItheAsshole confession offmychest ProRevenge TalesFromRetail relationship_advice pettyrevenge MaliciousCompliance unpopularopinion self TalesFromTheFrontDesk tifu TrueOffMyChest EntitledPeople; do
              if [ -d "$sub" ]; then
                echo "📂 Moving $sub to reddit_stories/"
                mv "$sub" reddit_stories/
              fi
            done

            # Verify JSON files exist
            echo "📂 Verifying JSON files in reddit_stories/"
            find reddit_stories/ -name "*.json" | head -10

            if [ -z "$(find reddit_stories/ -name '*.json' | head -1)" ]; then
              echo "❌ No JSON files found in reddit_stories/!"
              echo "📂 Contents of reddit_stories/:"
              ls -la reddit_stories/
              for sub in reddit_stories/*/; do
                echo "📂 $sub contents:"
                ls -la "$sub" || true
              done
              exit 1
            else
              echo "✅ JSON files found!"
              echo "📊 Story count per subreddit:"
              for sub in reddit_stories/*/; do
                if [ -d "$sub" ]; then
                  count=$(find "$sub" -name "*.json" | wc -l)
                  echo "   $(basename "$sub"): $count JSON files"
                fi
              done
            fi
          else
            echo "❌ reddit_stories.zip not found!"
            exit 1
          fi

      - name: Cache downloaded videos
        uses: actions/cache@v4
        id: video-cache
        with:
          path: cached_videos
          key: video-cache-${{ hashFiles('drive_clip_manager.py') }}
          restore-keys: |
            video-cache-

      - name: Cache video state (clip_state.json)
        uses: actions/cache@v4
        id: state-cache
        with:
          path: clip_state.json
          key: video-state
          restore-keys: |
            video-state-

      # NOTE: per-video time was cut drastically (no redundant full re-encode,
      # preset veryfast instead of medium), so 2 videos fit comfortably inside
      # the 360-min job limit. If you raise the count, prefer running several
      # workflow_dispatch runs in parallel over raising count in one run.
      - name: Generate videos
        id: generate
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COUNT="${{ inputs.count }}"
          else
            COUNT="2"
          fi
          echo "📹 Generating $COUNT videos..."
          echo "🔬 DEBUG_MODE is set to: ${{ env.DEBUG_MODE }}"

          for i in $(seq 1 $COUNT); do
            echo ""
            echo "======================================"
            echo "🎬 Video $i of $COUNT"
            echo "======================================"

            python -c "from tasks import generate_video_from_reddit; result = generate_video_from_reddit(); print(result)"

            if [ $? -ne 0 ]; then
              echo "❌ Video $i failed. Stopping..."
              break
            fi

            echo "✅ Video $i done"
            echo "🧹 Cleaning up..."

            rm -rf output/caption_segments_* 2>/dev/null
            rm -f output/segment_* 2>/dev/null
            rm -f output/gameplay_segment_* 2>/dev/null
            rm -f output/audio_processed_* 2>/dev/null
            rm -f output/video_combined_* 2>/dev/null
            rm -rf cached_videos/*.mp4 2>/dev/null
            rm -rf cached_videos/*.part 2>/dev/null
            pip cache purge 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            # || true: this is cosmetic cleanup — it must NEVER fail the job
            # (set -e -o pipefail would otherwise abort after a video was made).
            df -h | grep overlay || true
            echo "⏳ Waiting 30 seconds before next video..."
            sleep 30
          done

          echo "✅ All videos generated"

      # FIXED: CRF 18 videos are ~187 MB for a 100s short — GitHub rejects
      # files over 100 MB, so videos CANNOT be pushed to the repo anymore.
      # Upload them directly to YouTube as PRIVATE instead (same OAuth secrets
      # as the upload workflow). You review them in YouTube Studio, then make
      # them public yourself when you're happy.
      - name: Upload videos to YouTube (private)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY_STATUS: private
        run: |
          python - <<'PY'
          import glob
          import os

          from youtube_uploader import upload_to_youtube

          privacy = os.environ.get("PRIVACY_STATUS", "private")
          videos = sorted(glob.glob("output/*_captioned_*.mp4")) or sorted(glob.glob("output/*.mp4"))

          if not videos:
              print("ℹ️ No videos to upload.")
              raise SystemExit(0)

          for video in videos:
              metadata = video[:-4] + "_metadata.json"
              if not os.path.exists(metadata):
                  metadata = None

              print(f"📤 Uploading {os.path.basename(video)} as {privacy}...")
              video_id = upload_to_youtube(
                  video,
                  metadata_path=metadata,
                  privacy_status=privacy,
              )
              print(f"✅ Uploaded -> https://youtu.be/{video_id} (private)")
          PY

      - name: Push state files
        run: |
          # Persist used-story IDs and clip state so the next run doesn't reuse
          # the same stories (state JSONs only — videos are uploaded directly).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f used_story_ids.json test_used_ids.json clip_state.json 2>/dev/null || true
          git commit -m "Update story/clip state after generation" 2>/dev/null || echo "ℹ️ Nothing new to commit"
          git push origin main || echo "⚠️ State push failed"

      - name: Final cleanup
        run: |
          rm -rf output/*.mp4
          rm -rf cached_videos/*.mp4
          df -h
