name: Generate Faceless Video

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video story (AI generated)'
        required: false
        default: 'wedding betrayal best friend'
        type: string
      use_reddit_stories:
        description: 'Use real Reddit stories from local data'
        required: false
        default: true
        type: boolean
      subreddit:
        description: 'Specific subreddit to use (optional, e.g., AITAH)'
        required: false
        default: ''
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-server postgresql postgresql-contrib \
                                  mpg123 sox lame unzip tree

      - name: Start Redis & PostgreSQL
        run: |
          sudo service redis-server start
          sudo service postgresql start

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # UNZIP REDDIT STORIES DATA (ROBUST VERSION)
      # ------------------------------------------------------------
      - name: Unzip reddit stories
        run: |
          echo "📦 Checking for reddit_stories.zip..."
          
          if [ -f reddit_stories.zip ]; then
            echo "✅ Found reddit_stories.zip"
            echo "📂 Showing zip contents:"
            unzip -l reddit_stories.zip | head -20
            
            echo "📂 Extracting..."
            unzip -o reddit_stories.zip -d extracted/
            
            echo "📂 Extracted files:"
            ls -la extracted/
            
            # Handle different possible structures
            if [ -d extracted/reddit_stories ]; then
              echo "📂 Found nested reddit_stories folder, moving contents up..."
              # If there's a reddit_stories folder inside the extracted folder
              if [ "$(ls -A extracted/reddit_stories)" ]; then
                mkdir -p reddit_stories
                cp -r extracted/reddit_stories/* reddit_stories/
              else
                echo "⚠️ extracted/reddit_stories is empty!"
              fi
            elif [ -d extracted/AITAH ] || [ -d extracted/AmItheAsshole ]; then
              echo "📂 Found subreddit folders directly, moving..."
              mkdir -p reddit_stories
              # Move all subdirectories to reddit_stories
              for dir in extracted/*/; do
                if [ -d "$dir" ]; then
                  cp -r "$dir" reddit_stories/
                fi
              done
            else
              echo "⚠️ Unknown structure! Keeping extracted folder as-is"
              mv extracted reddit_stories
            fi
            
            # Clean up
            rm -rf extracted
            rm reddit_stories.zip
            
            echo "✅ Final reddit_stories structure:"
            ls -la reddit_stories/
            if [ -d reddit_stories ]; then
              echo "📂 Subreddit folders found:"
              ls -la reddit_stories/
            fi
          else
            echo "ℹ️ No reddit_stories.zip found"
          fi

      # ------------------------------------------------------------
      # CACHING: video files (downloaded from Google Drive)
      # ------------------------------------------------------------
      - name: Cache downloaded videos
        uses: actions/cache@v4
        id: video-cache
        with:
          path: cached_videos
          key: video-cache-${{ hashFiles('drive_clip_manager.py') }}
          restore-keys: |
            video-cache-

      # ------------------------------------------------------------
      # CACHING: clip state (progress across runs)
      # ------------------------------------------------------------
      - name: Cache video state (clip_state.json)
        uses: actions/cache@v4
        id: state-cache
        with:
          path: clip_state.json
          key: video-state
          restore-keys: |
            video-state-

      # ------------------------------------------------------------
      # DEBUG - Show what we have
      # ------------------------------------------------------------
      - name: Debug files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== reddit_stories folder ==="
          if [ -d reddit_stories ]; then
            ls -la reddit_stories/
            echo "=== Subreddit folders ==="
            for sub in reddit_stories/*/; do
              if [ -d "$sub" ]; then
                echo "Subreddit: $sub"
                ls -la "$sub" | head -5
                # Check for narrator_script files
                find "$sub" -name "narrator_script_*.json" | head -3
              fi
            done
          else
            echo "❌ reddit_stories folder does NOT exist!"
            echo "Creating empty reddit_stories folder as fallback..."
            mkdir -p reddit_stories
          fi

      # ------------------------------------------------------------
      # RUN THE GENERATOR
      # ------------------------------------------------------------
      - name: Run the video generator
        run: |
          cat > run_generator.py << 'EOF'
          import os
          import sys

          use_reddit_str = "${{ inputs.use_reddit_stories }}"
          subreddit = "${{ inputs.subreddit }}" if "${{ inputs.subreddit }}" != "" else None
          topic = "${{ inputs.topic }}"
          use_reddit = use_reddit_str.lower() == "true"

          print(f"🔧 Settings:")
          print(f"   use_reddit: {use_reddit}")
          print(f"   subreddit: {subreddit}")
          print(f"   topic: {topic}")
          
          # Check if reddit_stories exists
          reddit_exists = os.path.isdir("reddit_stories")
          print(f"   reddit_stories folder exists: {reddit_exists}")
          
          if reddit_exists:
              print("   Contents of reddit_stories:")
              for item in os.listdir("reddit_stories"):
                  print(f"      - {item}")
              # Count total stories
              total_stories = 0
              for sub in os.listdir("reddit_stories"):
                  sub_path = os.path.join("reddit_stories", sub)
                  if os.path.isdir(sub_path):
                      import glob
                      files = glob.glob(os.path.join(sub_path, "narrator_script_*.json"))
                      if files:
                          import json
                          with open(files[0], 'r') as f:
                              stories = json.load(f)
                              total_stories += len(stories)
                              print(f"      r/{sub}: {len(stories)} stories")
              print(f"   Total stories found: {total_stories}")

          if use_reddit and reddit_exists:
              print("\n📖 Using real Reddit stories from local data...")
              from tasks import generate_video_from_reddit
              result = generate_video_from_reddit(subreddit=subreddit)
          else:
              if use_reddit and not reddit_exists:
                  print("\n⚠️ Reddit stories requested but folder not found!")
                  print("   Falling back to AI-generated story...")
              else:
                  print("\n🤖 Using AI-generated story...")
              from tasks import generate_video
              result = generate_video(topic=topic, use_reddit=False)

          print("\n📊 Result:")
          print(result)
          EOF

          python run_generator.py

      # ------------------------------------------------------------
      # COLLECT OUTPUT
      # ------------------------------------------------------------
      - name: Prepare output directory and collect videos
        run: |
          mkdir -p output
          mv final_*.mp4 output/ || echo "No final videos found"
          mv output_*.mp4 output/ || echo "No output videos found"
          echo "--- Output files ---"
          ls -la output/

      - name: Upload the generated videos
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/*.mp4
          retention-days: 7
