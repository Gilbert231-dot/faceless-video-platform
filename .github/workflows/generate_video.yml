name: Generate Faceless Videos

on:
  schedule:
    # Only Batch 1 triggers via cron — it chains to Batches 2, 3, 4 automatically.
    # ⚠️ GitHub's cron is BEST-EFFORT: this expression is when the run is DUE, not
    # when it starts. Measured on this repo: the 01:00 UTC cron has actually been
    # starting 05:15–05:49 UTC every day (and a 22:00 cron started ~22:20). GitHub
    # creates the run late by a variable amount, and the api-driven chain batches
    # therefore also start late — that is expected, not a misconfiguration.
    # Nothing downstream depends on the start hour: each batch's publish slot is
    # recomputed as the next occurrence of its slot at least 1 h away, so the four
    # videos still go public in the intended order. The measured delay is printed
    # by the "Calculate publish schedule" step and its run summary.
    - cron: "0 1 * * *"    # Batch 1 — DUE 01:00 UTC (starts ~05:30 UTC in practice)
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch: 0=test (no chain), 1-4=production runs'
        required: true
        default: '0'
        type: string
      # Set ONLY by the previous batch's chain step. It is what lets a
      # dispatched run (Batch 2/3/4) chain onward to the next batch — a
      # manual dispatch leaves it 'false', so a hand-started production
      # batch never silently fires three more runs behind your back.
      chained:
        description: 'Internal: true = dispatched by the previous batch (do not set by hand)'
        required: false
        default: 'false'
        type: string
      # Escape hatch for a failed credential preflight: render anyway so the
      # finished video can be downloaded from the run's Artifacts and posted by
      # hand. Leave it 'false' — a normal run must never spend ElevenLabs
      # credits and a story on a video that cannot be uploaded.
      force_render:
        description: 'Internal: true = skip the credential preflight and render anyway'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write   # needed to push videos/state back to the repo
  actions: write    # needed to dispatch the upload workflow via gh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # PAUSE SWITCH: if a file named AUTOMATION_PAUSED exists at the repo root,
  # the whole pipeline is skipped (no ElevenLabs credits, no story consumed,
  # no posting). The run still shows green with generate skipped.
  #   To pause : add a file named AUTOMATION_PAUSED (any content) on GitHub.
  #   To resume: delete that file.
  pause-check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f AUTOMATION_PAUSED ]; then
            echo "⏸️  Automation is PAUSED — AUTOMATION_PAUSED file found in the repo."
            echo "    Delete that file on GitHub to resume (repo root → AUTOMATION_PAUSED → edit → delete)."
            echo "    This run FAILS on purpose so you get the usual failure-style"
            echo "    notification instead of a false 'success' ping."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ Automation active — no AUTOMATION_PAUSED file."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: pause-check
    if: needs.pause-check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-server postgresql postgresql-contrib \
                                  mpg123 sox lame unzip tree \
                                  fonts-dejavu-core fonts-liberation

      - name: Start Redis & PostgreSQL
        run: |
          sudo service redis-server start
          sudo service postgresql start

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          # Fail fast if the ElevenLabs key is missing/empty — otherwise the
          # run would burn 2-3 h rendering before dying at the TTS step.
          if [ -z "${{ secrets.ELEVENLABS_API_KEY }}" ]; then
            echo "❌ ELEVENLABS_API_KEY secret is missing or empty."
            echo "   Add it, or pause the automation (create AUTOMATION_PAUSED) until you've topped up credits."
            exit 1
          fi
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> $GITHUB_ENV
          # Dynamic background-footage listing (drive_clip_manager.py): when
          # GDRIVE_FOLDER_ID (public folder, "Anyone with the link") +
          # GDRIVE_API_KEY (Google Cloud key, Drive API enabled) are set, the
          # pipeline lists the folder automatically and picks up ANY new video
          # added to it. Without them it falls back to the hardcoded list.
          echo "GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }}" >> $GITHUB_ENV
          echo "GDRIVE_API_KEY=${{ secrets.GDRIVE_API_KEY }}" >> $GITHUB_ENV
          # DEBUG_MODE is read by config.py / tasks.py. Test mode => True (stories NOT consumed).
          # FIXED: the old `inputs.test_mode == 'true'` comparison silently fell
          # through to False (production!) whenever the boolean arrived as
          # 'True'/'TRUE'/true instead of exactly 'true' — a "test" run
          # consumed a story and posted a real video. Normalize in the shell:
          # any case-insensitive true => test mode. (Schedule runs have no
          # input => empty => production, as intended.)
          # Determine batch number: from cron (always 1) or manual input
          if [ "${{ github.event_name }}" == "schedule" ]; then
            BATCH_NUM="1"
          elif [ "${{ inputs.batch }}" == "0" ]; then
            BATCH_NUM="0"
          else
            BATCH_NUM="${{ inputs.batch }}"
          fi
          echo "BATCH_NUM=$BATCH_NUM" >> $GITHUB_ENV
          # Batch 0 = test mode (stories NOT consumed)
          if [ "$BATCH_NUM" == "0" ]; then
            echo "DEBUG_MODE=True" >> $GITHUB_ENV
          else
            echo "DEBUG_MODE=False" >> $GITHUB_ENV
          fi
          echo "FAST_MODE=True" >> $GITHUB_ENV
          # BACKGROUND render quality (video_compile.py): maximum quality.
          # CRF 15 is near-visually-lossless; preset=veryslow squeezes the
          # most out of every frame. Videos upload straight to YouTube —
          # GitHub's 100 MB limit is irrelevant — so the bigger files and
          # slower encode are fine.
          echo "VIDEO_CRF=15" >> $GITHUB_ENV
          echo "VIDEO_PRESET=veryslow" >> $GITHUB_ENV
          # THE ONLY PERMITTED DEGRADATION. Everything that produces delivered
          # pixels is CRF 15 + veryslow; a segment that fails outright is
          # retried once at CRF 18 + slow. (The old fallback was the ultrafast
          # preset, which is WORSE quality than 18/slow — it traded away
          # exactly what we were paying for.)
          echo "VIDEO_FALLBACK_CRF=18" >> $GITHUB_ENV
          echo "VIDEO_FALLBACK_PRESET=slow" >> $GITHUB_ENV
          # Mild post-upscale sharpening in the render chain (no extra encode).
          # A 9:16 crop of a 4K landscape frame is 1215x2160, so it is still
          # upscaled 1.19x to reach 1440x2560. Set to "off" to disable.
          echo "VIDEO_UNSHARP=5:5:0.6:5:5:0.0" >> $GITHUB_ENV
          # FOOTAGE_MODE=direct (default) renders straight from the downloaded
          # source and burns the captions in the same pass, so the footage is
          # encoded exactly ONCE at CRF 15 veryslow. FOOTAGE_MODE=staged is the
          # legacy rollback: 4K 60s batches, then a whole-footage normalizer
          # re-encode, then a SEPARATE caption re-encode of the finished video
          # (which capped the delivered file at CRF 18 slow).
          echo "FOOTAGE_MODE=direct" >> $GITHUB_ENV
          # The subscribe + like buttons and their sound, over the last ~20s.
          # Turned OFF deliberately: we are testing whether viewers still like
          # and comment with no on-screen prompt to do it. Flip to "true" to
          # restore the old ending (the overlays and their audio are untouched
          # on disk).
          echo "ENDING_ANIMATIONS=false" >> $GITHUB_ENV
          # The ding that used to land at 0:00, over the title card. Turned OFF
          # deliberately: the card and its whoosh carry the intro, and the bell
          # sat on top of the narrator's first words. The file stays on disk —
          # flip to "true" to restore it (TITLE_INTRO stays on, so the card and
          # the whoosh are unaffected).
          echo "INTRO_DING=false" >> $GITHUB_ENV
          # CAPTION burn settings for the FALLBACK caption pass only
          # (caption_utils.py). Captions are normally burned inside the render
          # above; this separate pass runs only if that failed.
          echo "CAPTION_CRF=18" >> $GITHUB_ENV
          echo "CAPTION_PRESET=slow" >> $GITHUB_ENV
          # compile_video()/caption_utils read OUTPUT_DIR from the environment.
          # Without it, videos land in the repo root and every output/* glob
          # (upload step, cleanup) silently misses them.
          echo "OUTPUT_DIR=output" >> $GITHUB_ENV
          # Set schedule times and batch name based on batch number
          case "$BATCH_NUM" in
            1)
              echo "🎬 BATCH 1: Afternoon post"
              echo "YOUTUBE_SCHEDULE_TIMES=15:00" >> $GITHUB_ENV
              echo "TIKTOK_SCHEDULE_TIMES=14:00" >> $GITHUB_ENV
              # Named by its PUBLISH slot, not by the hour the run happens to
              # start — GitHub's cron can start this batch ~4.5 h late.
              echo "BATCH_NAME=Batch 1 (15:00 UTC slot)" >> $GITHUB_ENV
              ;;
            2)
              echo "🎬 BATCH 2: Evening post"
              echo "YOUTUBE_SCHEDULE_TIMES=21:00" >> $GITHUB_ENV
              echo "TIKTOK_SCHEDULE_TIMES=18:00" >> $GITHUB_ENV
              echo "BATCH_NAME=Batch 2 (21:00 UTC slot)" >> $GITHUB_ENV
              ;;
            3)
              echo "🎬 BATCH 3: Late night post"
              echo "YOUTUBE_SCHEDULE_TIMES=23:00" >> $GITHUB_ENV
              echo "TIKTOK_SCHEDULE_TIMES=22:00" >> $GITHUB_ENV
              echo "BATCH_NAME=Batch 3 (23:00 UTC slot)" >> $GITHUB_ENV
              ;;
            *)
              echo "🎬 BATCH 4: Night owl post"
              echo "YOUTUBE_SCHEDULE_TIMES=03:00" >> $GITHUB_ENV
              echo "TIKTOK_SCHEDULE_TIMES=02:00" >> $GITHUB_ENV
              echo "BATCH_NAME=Batch 4 (03:00 UTC slot)" >> $GITHUB_ENV
              ;;
          esac

      # ── CREDENTIAL PREFLIGHT (fail fast) ─────────────────────────────────
      # Runs BEFORE the story is picked and before the ~1.5 h render, so a dead
      # posting credential costs ~3 minutes instead of a full render + TTS
      # credits + one story. That is what run #260 lost (2026-09-15): YouTube
      # answered `invalid_grant: Token has been expired or revoked` at the LAST
      # step and the finished video died with the ephemeral runner.
      # Checks YouTube + Facebook + TikTok, SKIPs any platform whose gate file
      # (FACEBOOK_ENABLED / TIKTOK_ENABLED) is off, and treats a transient
      # network blip as a warning so it can never cost a day's videos.
      #   Dead YouTube token → `python youtube_setup.py`, then update the
      #   YOUTUBE_REFRESH_TOKEN secret. Google expires these tokens 7 days after
      #   they are minted while the OAuth app's publishing status is "Testing" —
      #   publishing the app to "In production" stops that weekly cycle.
      # Skipped in LOCAL_UPLOAD_MODE (that path uploads from your laptop) and
      # when force_render=true.
      - name: Verify posting credentials (fail fast)
        if: ${{ !vars.LOCAL_UPLOAD_MODE && inputs.force_render != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          # Optional: the TikTok check can only persist a rotated refresh token
          # when this PAT is present.
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python verify_posting_credentials.py

      # The story bank now lives directly in the repo as reddit_stories/ (the
      # old reddit_stories.zip was 146 MB unpacked, mostly raw comment dumps
      # the pipeline never reads). The folder is authoritative: fetch_stories.py
      # (run on the user's laptop — Reddit blocks GitHub runner IPs) refills
      # it when the bank runs low, and cleanup_used_stories.py keeps it lean.
      - name: Verify reddit stories present
        run: |
          if find reddit_stories \( -name 'stories_with_comments_*.json' -o -name 'stories_*.json' \) | head -1 | grep -q .; then
            echo "✅ Story files found in reddit_stories/"
          else
            echo "❌ No story files found in reddit_stories/!"
            echo "   Run 'python fetch_stories.py' on your laptop to refill."
            exit 1
          fi

      - name: Cache downloaded videos
        uses: actions/cache@v4
        id: video-cache
        with:
          path: cached_videos
          # '-4k' bumps the key so the old 1080p cache (stale file IDs from
          # the replaced folder) is orphaned instead of restored: the new 4K
          # sources are 0.5-5 GB each and are downloaded by file ID anyway.
          key: video-cache-4k-${{ hashFiles('drive_clip_manager.py') }}
          restore-keys: |
            video-cache-4k-

      # NOTE: clip_state.json (background-footage position) is intentionally
      # NOT cached. GitHub cache keys are immutable, so a fixed key would
      # restore the SAME frozen position on every run — every video would be
      # cut from the same spot of the same footage file (the "all backgrounds
      # look the same" bug). The repo file (pushed after each run) is the
      # single source of truth.

      # NOTE: per-video time was cut drastically (no redundant full re-encode,
      # preset veryfast instead of medium), so 2 videos fit comfortably inside
      # the 360-min job limit. If you raise the count, prefer running several
      # workflow_dispatch runs in parallel over raising count in one run.
      - name: "Generate videos (${{ env.BATCH_NAME || 'Manual' }})"
        id: generate
        run: |
          # One video per run — the dispatch dialog no longer exposes a
          # count input; every batch (scheduled or manual) makes exactly 1.
          COUNT="1"
          echo "📹 $BATCH_NAME: Generating $COUNT videos..."
          echo "🔬 DEBUG_MODE is set to: ${{ env.DEBUG_MODE }}"

          # Free the ~3 GB pip cache BEFORE the heavy encoding so the runner
          # disk has headroom while rendering segments (ffmpeg I/O errors like
          # exit 234 happened when the disk got tight).
          pip cache purge >/dev/null 2>&1 || true

          for i in $(seq 1 $COUNT); do
            echo ""
            echo "======================================"
            echo "🎬 Video $i of $COUNT"
            echo "======================================"

            # FIXED: generate_video_from_reddit CATCHES all exceptions and
            # returns a status dict, so the old `$? -ne 0` check never fired
            # — a failed render printed "✅ Video i done" and the run limped
            # on to upload nothing. Check the actual status now and fail the
            # job loudly.
            # OBSERVABILITY FIX: the old `| tail -1` kept the JSON result but
            # THREW AWAY everything else tasks.py printed — including
            # "[drive] Source video: WxH", "FOOTAGE_MODE=direct", the
            # "📊 Quality: CRF ..." line and the WEAK-SOURCE warning. A
            # finished run therefore could not be verified from its own log.
            # Now the full stdout+stderr is captured to a file and echoed, so
            # every run explains its own quality; only the last line (the JSON)
            # is parsed, exactly as before.
            RENDER_LOG="/tmp/render_$i.log"
            set +e
            python -c "from tasks import generate_video_from_reddit; import json; print(json.dumps(generate_video_from_reddit()))" > "$RENDER_LOG" 2>&1
            RENDER_RC=$?
            set -e
            cat "$RENDER_LOG"
            if [ "$RENDER_RC" -ne 0 ]; then
              echo "❌ Video $i FAILED (python exited $RENDER_RC)."
              exit 1
            fi
            RESULT=$(tail -1 "$RENDER_LOG")
            STATUS=$(echo "$RESULT" | python -c "import json,sys; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo error)

            if [ "$STATUS" != "success" ]; then
              echo "❌ Video $i FAILED (status=$STATUS). Details:"
              echo "$RESULT"
              exit 1
            fi

            echo "✅ Video $i done"
            echo "🧹 Cleaning up..."

            rm -rf output/caption_segments_* 2>/dev/null
            rm -f output/segment_* 2>/dev/null
            rm -f output/gameplay_segment_* 2>/dev/null
            rm -f output/audio_processed_* 2>/dev/null
            rm -f output/video_combined_* 2>/dev/null
            rm -rf cached_videos/*.mp4 2>/dev/null
            rm -rf cached_videos/*.part 2>/dev/null
            pip cache purge 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            # || true: this is cosmetic cleanup — it must NEVER fail the job
            # (set -e -o pipefail would otherwise abort after a video was made).
            # df -h . always prints the runner's disk state into the log so
            # ffmpeg I/O failures (exit 234) can be checked against free space.
            df -h . || true
            echo "⏳ Waiting 30 seconds before next video..."
            sleep 30
          done

          echo "✅ All videos generated"

      # Remove today's used stories from the bank (they were marked used
      # during generation) and drop legacy comment dumps — keeps the folder
      # from crowding. Runs before the state push so the cleaned files ship.
      - name: Remove used stories (keep folder lean)
        run: |
          python cleanup_used_stories.py

      # FIXED (story repeats): persist the used-marks NOW, before any upload
      # step.  The old flow only pushed used_story_ids.json at the very end
      # ("Push state files"), so any run that failed at an upload step lost
      # its marks and the next run re-picked the same story.  If this push
      # fails it's non-fatal — the final push (if: always()) retries later.
      # always(): also ships partial marks when a multi-video run dies after
      # marking some stories used but before finishing all of them.
      - name: Push used-story state (early)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f used_story_ids.json 2>/dev/null || true
          git add -f reddit_stories/ 2>/dev/null || true
          git commit -m "Persist used-story marks before upload" 2>/dev/null || echo "ℹ️ Nothing new to commit"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main || echo "⚠️ Early state push failed"

      # FIXED: CRF 18 videos are ~187 MB for a 100s short — GitHub rejects
      # files over 100 MB, so videos CANNOT be pushed to the repo anymore.
      # Upload them directly to YouTube as PRIVATE instead (same OAuth secrets
      # as the upload workflow). You review them in YouTube Studio, then make
      # them public yourself when you're happy.
      # Privacy comes from the YOUTUBE_PRIVACY repo file (same pattern as
      # AUTOMATION_PAUSED / TIKTOK_ENABLED): set it ONCE to 'public' and every
      # run — manual OR the daily scheduled run — posts public from then on.
      # Valid values: private / unlisted / public. Anything else (or a missing
      # file) safely defaults to private. GitHub dispatch inputs were rejected
      # for this on purpose: they reset to defaults every run, so 'public'
      # would silently not stick — the file is the single source of truth.
      # Pre-upload safety check: verify every finished video matches
      # YouTube's processing requirements (H.264 High, yuv420p, AAC,
      # faststart) BEFORE uploading — catches a bad encode here instead of
      # as "Processing abandoned" on YouTube. Fails the run on any violation.
      - name: Verify videos are YouTube-compatible
        run: |
          python verify_youtube_compat.py

      # Calculate publish schedule times for both YouTube and Facebook.
      # This runs ALWAYS — even in LOCAL_UPLOAD_MODE — so Facebook gets slots.
      - name: Calculate publish schedule
        run: |
          python - <<'PY'
          import os
          from youtube_schedule import next_publish_times

          privacy = "private"
          try:
              with open("YOUTUBE_PRIVACY", encoding="utf-8") as f:
                  privacy = f.read().strip().lower()
          except FileNotFoundError:
              pass
          if privacy not in ("private", "unlisted", "public"):
              privacy = "private"
          if os.environ.get("DEBUG_MODE", "").lower() == "true":
              privacy = "private"

          import glob
          videos = sorted(glob.glob("output/*_captioned_*.mp4")) or sorted(glob.glob("output/*.mp4"))
          count = len(videos)

          if privacy == "public" and count > 0:
              publish_times = next_publish_times(count)
              times_str = ",".join(t for t in publish_times if t)
          else:
              times_str = ""

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PUBLISH_TIMES={times_str}\n")
              f.write(f"YOUTUBE_PRIVACY_VALUE={privacy}\n")
          # --- Cron drift readout -------------------------------------------
          # GitHub's schedule trigger is best-effort: the run is created LATE by
          # a variable amount, so the cron says when the run is DUE, not when it
          # starts. Measured on this repo: the 01:00 UTC cron starts 05:15–05:49
          # UTC. Printing the real delay every run makes a growing drift visible
          # instead of silent. Nothing below depends on it — each slot is
          # recomputed as the next occurrence at least MIN_AHEAD (1 h) away.
          import datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          cron = "${{ github.event.schedule }}".strip()
          summary = []
          if cron:
              fields = cron.split()
              if len(fields) >= 2 and fields[0].isdigit() and fields[1].isdigit():
                  due = now.replace(hour=int(fields[1]), minute=int(fields[0]),
                                    second=0, microsecond=0)
                  minutes = int((now - due).total_seconds() // 60)
                  delay = f"+{minutes // 60}h{minutes % 60:02d}m" if minutes >= 0 else f"{minutes}m"
                  print(f"⏱️  Cron '{cron}' was due {due:%H:%M} UTC — this run started "
                        f"{now:%H:%M} UTC ({delay} late).")
                  summary.append(
                      f"Cron `{cron}` was due {due:%H:%M} UTC; the run started "
                      f"{now:%H:%M} UTC (**{delay} late**). GitHub's cron is "
                      f"best-effort — see the note at the top of the workflow file."
                  )

          print(f"📅 Schedule: privacy={privacy}, times={times_str}, videos={count}")

          # Where the slot actually landed, relative to the run's own day.
          # A slot "tomorrow" is NORMAL, not a fault: by the time the night-owl
          # batch renders, its 03:00 slot has already gone by, so the slot
          # resolves to the next occurrence — that is the designed behaviour
          # (see youtube_schedule.next_publish_times). A warning is reserved for
          # a slot MORE THAN A DAY out, which means something is genuinely wrong
          # (the video would sit an extra day — the old Sep-25 bug where slots
          # marched weeks into the future).
          if times_str:
              landed = []
              for slot in times_str.split(","):
                  if not slot:
                      continue
                  try:
                      when = datetime.datetime.strptime(slot, "%Y-%m-%dT%H:%M:%SZ").replace(
                          tzinfo=datetime.timezone.utc)
                  except ValueError:
                      landed.append(slot)
                      continue
                  hours = (when - now).total_seconds() / 3600.0
                  if when.date() == now.date():
                      landed.append(f"{slot} (today, in {hours:.1f} h)")
                  else:
                      landed.append(f"{slot} (in {hours:.1f} h)")
                  if hours > 26:
                      print(f"⚠️  Publish slot {slot} is {hours / 24:.1f} days away — "
                            f"expected at most ~1 day. Check YOUTUBE_SCHEDULE_TIMES "
                            f"and the schedule state file.")
              print(f"🗓️  Publish slot(s): {'; '.join(landed)}")
              summary.append("Publish slot(s): " + "; ".join(landed))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n### 📅 Schedule\n\n"
                          + "\n".join(f"- {line}" for line in summary) + "\n")
          PY

      # LOCAL UPLOAD MODE: When LOCAL_UPLOAD_MODE=true, skip the YouTube upload
      # step here. Videos are saved as artifacts and uploaded from the user's
      # laptop using local_youtube_upload.py (residential IP = better algorithm push).
      - name: Local upload mode notice
        if: ${{ vars.LOCAL_UPLOAD_MODE }}
        run: |
          echo "🏠 LOCAL UPLOAD MODE is enabled"
          echo "   YouTube upload is skipped — videos will be uploaded from your laptop"
          echo "   Run 'python local_youtube_upload.py' on your laptop to upload"

      - name: Upload videos to YouTube
        if: ${{ !vars.LOCAL_UPLOAD_MODE }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          from youtube_uploader import upload_to_youtube
          from video_history import record_video

          privacy = os.environ.get("YOUTUBE_PRIVACY_VALUE", "private")
          print(f"🔒 YouTube privacy: {privacy}")
          videos = sorted(glob.glob("output/*_captioned_*.mp4")) or sorted(glob.glob("output/*.mp4"))

          if not videos:
              print("❌ No videos were generated — the run produced nothing.")
              raise SystemExit(1)

          raw_times = os.environ.get("PUBLISH_TIMES", "")
          publish_times = [t if t else None for t in raw_times.split(",")] if raw_times else [None] * len(videos)
          # Pad if fewer times than videos
          while len(publish_times) < len(videos):
              publish_times.append(None)

          for video, publish_at in zip(videos, publish_times):
              metadata_path = video[:-4] + "_metadata.json"
              meta = {}
              if os.path.exists(metadata_path):
                  with open(metadata_path, encoding="utf-8") as f:
                      meta = json.load(f)

              if publish_at:
                  print(f"📤 Uploading {os.path.basename(video)} — scheduled public at {publish_at}")
              else:
                  print(f"📤 Uploading {os.path.basename(video)} as {privacy}...")
              try:
                  video_id = upload_to_youtube(
                      video,
                      metadata_path=metadata_path if meta else None,
                      privacy_status=privacy,
                      publish_at=publish_at,
                  )
              except Exception as e:
                  record_video(video, metadata=meta, status="failed", error=e)
                  raise
              record_video(video, metadata=meta, video_id=video_id, status="posted",
                           publish_at=publish_at)
              if publish_at:
                  print(f"✅ Uploaded -> https://youtu.be/{video_id} (goes public {publish_at})")
              else:
                  print(f"✅ Uploaded -> https://youtu.be/{video_id} ({privacy})")
          PY

      # TikTok posting via the official Content Posting API. Gated by the
      # TIKTOK_ENABLED repo file (flip to 'true' after the manual setup in
      # TIKTOK_SETUP.md). Posts are SELF_ONLY (private) by default: until the
      # app passes TikTok's audit, ALL API posts are forced private anyway,
      # and you review each video before ever making anything public.
      - name: Upload videos to TikTok (private)
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          # Optional fine-grained PAT ("Secrets" repo permission) so the run
          # can persist TikTok's rotated refresh token automatically.
          GH_PAT: ${{ secrets.GH_PAT }}
          # SELF_ONLY = private. Set to PUBLIC_TO_EVERYONE (after the audit
          # passes) when you want videos to go live automatically.
          TIKTOK_PRIVACY_LEVEL: SELF_ONLY
        run: |
          ENABLED=$(tr -d ' \r\n' < TIKTOK_ENABLED 2>/dev/null || echo false)
          if [ "$ENABLED" != "true" ]; then
            echo "⏭️  TikTok posting disabled (TIKTOK_ENABLED is not 'true'). Skipping."
            exit 0
          fi
          if [ -z "$TIKTOK_CLIENT_KEY" ] || [ -z "$TIKTOK_CLIENT_SECRET" ] || [ -z "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "⏭️  TikTok secrets not configured yet — follow TIKTOK_SETUP.md to enable."
            exit 0
          fi
          python - <<'PY'
          import glob
          import json
          import os

          from tiktok_uploader import build_caption, publish_tiktok, save_refresh_token_via_gh

          privacy = os.environ.get("TIKTOK_PRIVACY_LEVEL", "SELF_ONLY")
          videos = sorted(glob.glob("output/*_captioned_*.mp4")) or sorted(glob.glob("output/*.mp4"))

          if not videos:
              print("❌ No videos found for TikTok upload.")
              raise SystemExit(1)

          for video in videos:
              metadata = video[:-4] + "_metadata.json"
              meta = json.load(open(metadata)) if os.path.exists(metadata) else {}
              caption = build_caption(meta)
              print(f"📱 Uploading {os.path.basename(video)} to TikTok ({privacy})...")
              # access_token=… : the credential preflight already refreshed and
              # persisted the token this run. Passing it here avoids a SECOND
              # refresh, which would rotate the refresh token again and leave
              # this call holding one the preflight already superseded.
              # (Empty when the preflight was skipped — then this refreshes as
              # before, exactly like a normal TikTok post.)
              result = publish_tiktok(
                  video,
                  title=caption,
                  privacy_level=privacy,
                  on_new_refresh_token=save_refresh_token_via_gh,
                  access_token=os.environ.get("TIKTOK_ACCESS_TOKEN") or None,
              )
              print(f"✅ TikTok publish complete: {result}")
          PY

      # Facebook posting via the official Graph API Video API. Gated by the
      # FACEBOOK_ENABLED repo file (flip to 'true' after the manual setup in
      # FACEBOOK_SETUP.md). Test runs post DRAFTS (admin-only — the FB
      # equivalent of private); production runs post PUBLISHED, scheduled at
      # the SAME slots YouTube used (PUBLISH_TIMES exported by the YouTube
      # step above), so the same video goes live on both platforms together.
      - name: Upload videos to Facebook
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          ENABLED=$(tr -d ' \r\n' < FACEBOOK_ENABLED 2>/dev/null || echo false)
          if [ "$ENABLED" != "true" ]; then
            echo "⏭️  Facebook posting disabled (FACEBOOK_ENABLED is not 'true'). Skipping."
            exit 0
          fi
          if [ -z "$FB_APP_ID" ] || [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "⏭️  Facebook secrets not configured yet — follow FACEBOOK_SETUP.md to enable."
            exit 0
          fi
          python - <<'PY'
          import glob
          import json
          import os

          from facebook_poster import build_description, publish_to_facebook
          from video_history import record_video

          test_mode = os.environ.get("DEBUG_MODE", "").lower() == "true"
          # ISO 8601 publish slots exported by the YouTube step (same times,
          # one scheduling decision per run). Empty in private/test mode.
          raw_times = os.environ.get("PUBLISH_TIMES", "")
          publish_times = [t for t in raw_times.split(",") if t]

          videos = sorted(glob.glob("output/*_captioned_*.mp4")) or sorted(glob.glob("output/*.mp4"))

          if not videos:
              print("❌ No videos found for Facebook upload.")
              raise SystemExit(1)

          for i, video in enumerate(videos):
              metadata = video[:-4] + "_metadata.json"
              meta = json.load(open(metadata)) if os.path.exists(metadata) else {}

              # TEST runs always post DRAFTS (page-admin only) — a [TEST]
              # video must never go live on Facebook either.
              if test_mode:
                  published = False
                  scheduled = None
                  print(f"🔒 Test run: posting {os.path.basename(video)} as a DRAFT (admin-only)")
              else:
                  published = True
                  scheduled = publish_times[i] if i < len(publish_times) else None

              # Custom thumbnail (the reddit card) — same cover as YouTube,
              # set via the Video Thumbnails API after the video is posted.
              # Fails softly if the token lacks the scope; video still posts.
              thumb = meta.get("thumbnail")
              thumb = thumb if thumb and os.path.exists(thumb) else None

              try:
                  result = publish_to_facebook(
                      video,
                      title=meta.get("title") or os.path.basename(video)[:-4],
                      description=build_description(meta),
                      published=published,
                      scheduled_publish_time=scheduled,
                      thumbnail_path=thumb,
                  )
              except Exception as e:
                  # Record the failure so the dashboard shows it, then fail the run.
                  record_video(video, metadata=meta, status="failed",
                               platform="facebook", error=e)
                  raise
              record_video(video, metadata=meta, video_id=result.get("id"),
                           status="posted", platform="facebook", url=result.get("url"),
                           publish_at=scheduled)
              if scheduled:
                  print(f"✅ Facebook post -> {result.get('url')} (goes public {scheduled})")
              else:
                  print(f"✅ Facebook post -> {result.get('url')}")
          PY

      # Refresh the dashboard's data.json (story stats + video history) so the
      # deployed GitHub Pages dashboard stays current after every run.
      - name: Refresh dashboard data
        run: |
          python dashboard/build_data.py

      # Refresh the landing-page demo clip (assets/demo/real_demo.mp4) from
      # the newest generated video, so the app's website always shows the
      # latest product sample. Committed by the Push state files step below.
      - name: Refresh landing-page demo
        run: |
          python make_landing_demo.py

      - name: Push state files
        # FIXED (story repeats): always() — push used-marks and history even
        # when an upload step failed, so the next run can't re-pick the story.
        if: always()
        run: |
          # Persist used-story IDs and clip state so the next run doesn't reuse
          # the same stories (state JSONs only — videos are uploaded directly).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # FIXED: git add ABORTS and stages NOTHING if any pathspec is missing
          # (test_used_ids.json / clip_state.json don't exist on a fresh runner).
          # Add each file separately so one missing file can't block the others.
          git add -f used_story_ids.json 2>/dev/null || true
          git add -f test_used_ids.json 2>/dev/null || true
          git add -f clip_state.json 2>/dev/null || true
          # TikTok schedule slot counter (next free 2/day slot per video).
          git add -f tiktok_schedule_state.json 2>/dev/null || true
          # YouTube publish-slot counter (keeps same-day videos far apart).
          git add -f youtube_schedule_state.json 2>/dev/null || true
          # Dashboard video history (titles, subreddits, YouTube URLs, status).
          git add -f video_history.json 2>/dev/null || true
          # Regenerated dashboard data (story stats + video history).
          git add -f dashboard/data.json 2>/dev/null || true
          # Landing-page demo clip + poster (regenerated from the newest video
          # by the Refresh landing-page demo step above).
          git add -f assets/demo/real_demo.mp4 2>/dev/null || true
          git add -f assets/demo/real_poster.jpg 2>/dev/null || true
          # Voiceover QA report (residual 'ale' check) — one per video.
          git add -f output/voiceover_qa_*.json 2>/dev/null || true
          # Exact text sent to ElevenLabs (proves what the narrator was asked
          # to say — ale/markdown/brackets all cleaned pre-TTS).
          git add -f output/tts_script_*.json 2>/dev/null || true
          # Cleaned story bank (used stories removed by cleanup_used_stories.py).
          git add -f reddit_stories/ 2>/dev/null || true
          git commit -m "Update story/clip state after generation" 2>/dev/null || echo "ℹ️ Nothing new to commit"
          # Rebase onto whatever landed on main since the run started, so the
          # state push can't be rejected when the run took a long time.
          git pull --rebase origin main 2>/dev/null || true
          git push origin main || echo "⚠️ State push failed"

      # Download the ORIGINAL generated videos (no re-encode). GitHub's 100 MB
      # repo-file limit doesn't apply to artifacts, and the zip download
      # appears on the run page (Artifacts section) — so the user can grab the
      # pristine mp4s for TikTok uploads (downloading from YouTube would
      # double-compress them). The files are the exact ones uploaded to
      # YouTube, so TikTok's own re-encode is the only compression loss.
      # Also ships each video's metadata JSONs: _metadata.json (YouTube-style)
      # and _tiktok.json (caption + manual-upload settings, tailored to
      # tiktok.com's upload panel). Retention is 7 days (default would be 90)
      # — download before it expires. NOTE: this repo is PUBLIC, so the
      # artifacts are downloadable by anyone with the run link during
      # retention — fine for faceless story videos, but worth knowing while
      # content is still in the review stage.
      - name: Download original videos (artifacts)
        # !cancelled() (not plain success()): if any LATER step fails — a dead
        # Facebook/TikTok token, an upload error — the finished video must still
        # be downloadable so it can be posted by hand. Before this, run #260's
        # fully-rendered video was thrown away with the ephemeral runner.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
            output/*.jpg
            # Belt AND braces: the Facebook-only copy (608x1080, ~4.7 Mbps) is
            # written to a temp dir now, but it must never be downloadable beside
            # the real video again - a manual upload that picks it gets soft video
            # on TikTok with nothing to show for it.
            !output/*.fb_compress.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Final cleanup
        run: |
          rm -rf output/*.mp4
          rm -rf cached_videos/*.mp4
          df -h


      # CHAIN FIX (why only 2 of the 4 daily videos were being made):
      # only Batch 1 fires from cron; it used to chain to Batch 2, and Batch 2
      # then STOPPED — because the old guard ended with
      # `github.event_name != 'workflow_dispatch'`, and every chained batch
      # (2, 3, 4) IS a workflow_dispatch run. So the chain died one hop in and
      # Batches 3 + 4 never ran (verified in the run history: each daily
      # scheduled run produces exactly one bot-dispatched run, and then
      # nothing).
      # Now the chain continues when the run is EITHER the scheduled Batch 1
      # OR a batch dispatched by the previous batch (`chained=true`), and the
      # batch-number gate lives in the shell where BATCH_NUM is a plain
      # environment variable — so a test run (batch 0) and the final Batch 4
      # can never chain, whatever the event type is.
      - name: "🔗 Trigger next batch (chain)"
        # !cancelled() instead of success(): a batch that dies mid-run (TTS error,
        # render timeout, upload failure) must NOT wipe out the rest of the day's
        # slots — every batch is an independent run that would still make its own
        # video. Cancelling a run by hand is how the chain is stopped on purpose.
        # (A skipped `generate` job — AUTOMATION_PAUSED — runs no steps at all,
        # so the pause switch is unaffected.)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.chained == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$BATCH_NUM" in
            1|2|3) ;;
            *)
              echo "ℹ️ BATCH_NUM='$BATCH_NUM' — nothing to chain (0=test, 4=last batch of the day)."
              exit 0
              ;;
          esac

          NEXT_BATCH=$((BATCH_NUM + 1))
          WF=generate_video.yml
          REF=main
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WF"

          echo "⏰ Waiting 30 minutes before triggering Batch $NEXT_BATCH..."
          sleep 1800

          # Has a dispatch already landed in the last 15 minutes? A dispatch can
          # succeed while its HTTP response never comes back — retrying that
          # would queue a DUPLICATE run (an extra video consuming a story and
          # API quota for the next slot). This check makes the retry idempotent.
          already_queued() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$API/runs?event=workflow_dispatch&per_page=5" 2>/dev/null \
            | python -c "import json,sys,datetime; d=json.load(sys.stdin); cut=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(minutes=15); print('yes' if any(datetime.datetime.strptime(r['created_at'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)>=cut for r in d.get('workflow_runs',[])) else 'no')" 2>/dev/null | grep -q yes
          }

          # The old chain called `gh workflow run` exactly once. A single failed
          # call at the very LAST step of a 2-hour run silently cost the rest of
          # the day's videos (Batch 2's dispatch of Batch 3 failed on 2026-09-13
          # — the video itself had already been made and uploaded fine). Now a
          # transient API/CLI failure is retried, with a second path that does
          # not depend on the gh CLI at all.
          dispatch_gh() {
            gh workflow run "$WF" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$REF" \
              -f batch="$NEXT_BATCH" \
              -f chained=true
          }

          # REST API fallback: returns HTTP 204 (empty body) on a successful
          # dispatch, so --fail-with-body makes the exit status a clean signal.
          dispatch_api() {
            curl -sS --fail-with-body -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/dispatches" \
              -d "{\"ref\":\"$REF\",\"inputs\":{\"batch\":\"$NEXT_BATCH\",\"chained\":\"true\"}}"
          }

          for attempt in 1 2 3; do
            echo "🔗 Triggering Batch $NEXT_BATCH (attempt $attempt)..."
            if dispatch_gh; then
              echo "✅ Batch $NEXT_BATCH triggered (gh)."
              exit 0
            fi
            echo "⚠️  gh dispatch failed — trying the REST API directly..."
            if dispatch_api; then
              echo "✅ Batch $NEXT_BATCH triggered (REST API)."
              exit 0
            fi
            echo "⚠️  Both dispatch paths failed on attempt $attempt."
            if already_queued; then
              echo "✅ A run was queued in the last 15 minutes — the dispatch actually landed. Not retrying."
              exit 0
            fi
            sleep $((attempt * 30))
          done

          # Loud and actionable: never lose a batch silently again.
          {
            echo "### ⚠️ Batch $NEXT_BATCH was NOT triggered"
            echo ""
            echo "Both dispatch paths (gh CLI and the REST API) failed 3 times."
            echo "Today's later batch(es) will not run automatically."
            echo "Trigger it by hand: Actions → Generate Faceless Videos → Run workflow"
            echo "→ batch = \`$NEXT_BATCH\`, chained = \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "❌ Could not trigger Batch $NEXT_BATCH after 3 attempts."
          exit 1
