name: Generate Faceless Video

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the video story (AI generated)'
        required: false
        default: 'wedding betrayal best friend'
        type: string
      use_reddit_stories:
        description: 'Use real Reddit stories from local data'
        required: false
        default: true
        type: boolean
      subreddit:
        description: 'Specific subreddit to use (optional, e.g., AITAH)'
        required: false
        default: ''
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-server postgresql postgresql-contrib \
                                  mpg123 sox lame unzip

      - name: Start Redis & PostgreSQL
        run: |
          sudo service redis-server start
          sudo service postgresql start

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # UNZIP REDDIT STORIES DATA (if uploaded as zip)
      # ------------------------------------------------------------
      - name: Unzip reddit stories
        run: |
          if [ -f reddit_stories.zip ]; then
            echo "📦 Found reddit_stories.zip, unzipping..."
            unzip -o reddit_stories.zip -d reddit_stories/
            rm reddit_stories.zip
            echo "✅ Unzipped reddit stories to reddit_stories/"
            ls -la reddit_stories/
          else
            echo "ℹ️ No reddit_stories.zip found. Checking if reddit_stories folder exists..."
            if [ -d reddit_stories ]; then
              echo "✅ reddit_stories folder found!"
              ls -la reddit_stories/
            else
              echo "⚠️ No reddit_stories data found! Will use AI-generated stories."
            fi
          fi

      # ------------------------------------------------------------
      # CACHING: video files (downloaded from Google Drive)
      # ------------------------------------------------------------
      - name: Cache downloaded videos
        uses: actions/cache@v4
        id: video-cache
        with:
          path: cached_videos
          key: video-cache-${{ hashFiles('drive_clip_manager.py') }}
          restore-keys: |
            video-cache-

      # ------------------------------------------------------------
      # CACHING: clip state (progress across runs)
      # ------------------------------------------------------------
      - name: Cache video state (clip_state.json)
        uses: actions/cache@v4
        id: state-cache
        with:
          path: clip_state.json
          key: video-state
          restore-keys: |
            video-state-

      # ------------------------------------------------------------
      # (Optional) Debug – show cached contents
      # ------------------------------------------------------------
      - name: List cached files
        run: |
          echo "--- Cached videos ---"
          ls -la cached_videos/ || echo "(none yet)"
          echo "--- State file ---"
          cat clip_state.json 2>/dev/null || echo "(no state file yet)"
          echo "--- Reddit stories ---"
          if [ -d reddit_stories ]; then
            echo "Found reddit_stories folder:"
            ls -la reddit_stories/
          else
            echo "No reddit_stories folder found"
          fi

      # ------------------------------------------------------------
      # RUN THE GENERATOR (FIXED - using a Python script file)
      # ------------------------------------------------------------
      - name: Run the video generator
        run: |
          # Create a Python script to avoid indentation issues
          cat > run_generator.py << 'EOF'
          import os
          import sys

          use_reddit = ${{ inputs.use_reddit_stories }}
          subreddit = "${{ inputs.subreddit }}" if "${{ inputs.subreddit }}" != "" else None
          topic = "${{ inputs.topic }}"

          if use_reddit and os.path.isdir("reddit_stories"):
              print("📖 Using real Reddit stories from local data...")
              from tasks import generate_video_from_reddit
              result = generate_video_from_reddit(subreddit=subreddit)
          else:
              print("🤖 Using AI-generated story...")
              from tasks import generate_video
              result = generate_video(topic=topic, use_reddit=False)

          print(result)
          EOF

          # Execute the script
          python run_generator.py

      # ------------------------------------------------------------
      # COLLECT OUTPUT
      # ------------------------------------------------------------
      - name: Prepare output directory and collect videos
        run: |
          mkdir -p output
          mv final_*.mp4 output/ || echo "No final videos found"
          mv output_*.mp4 output/ || echo "No output videos found"
          echo "--- Output files ---"
          ls -la output/

      - name: Upload the generated videos
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/*.mp4
          retention-days: 7
