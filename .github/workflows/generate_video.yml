name: Generate Faceless Videos

on:
  schedule:
    - cron: "0 2 * * *"   # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: true
        default: '2'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6-hour max

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-server postgresql postgresql-contrib \
                                  mpg123 sox lame unzip tree

      - name: Start Redis & PostgreSQL
        run: |
          sudo service redis-server start
          sudo service postgresql start

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}" >> $GITHUB_ENV
          echo "REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          echo "FAL_KEY=${{ secrets.FAL_KEY }}" >> $GITHUB_ENV
          echo "DEBUG_MODE=False" >> $GITHUB_ENV
          echo "FAST_MODE=True" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # UNZIP REDDIT STORIES DATA (if uploaded as zip)
      # ------------------------------------------------------------
      - name: Unzip reddit stories
        run: |
          if [ -f reddit_stories.zip ]; then
            echo "📦 Found reddit_stories.zip, unzipping..."
            unzip -o reddit_stories.zip -d reddit_stories/
            rm reddit_stories.zip
            echo "✅ Unzipped reddit stories"
            ls -la reddit_stories/
          else
            echo "ℹ️ No reddit_stories.zip found, checking if folder exists..."
            if [ -d reddit_stories ]; then
              echo "✅ reddit_stories folder found"
            else
              echo "⚠️ No reddit_stories data found! Will use AI-generated stories."
            fi
          fi

      # ------------------------------------------------------------
      # CACHING: video files (downloaded from Google Drive)
      # ------------------------------------------------------------
      - name: Cache downloaded videos
        uses: actions/cache@v4
        id: video-cache
        with:
          path: cached_videos
          key: video-cache-${{ hashFiles('drive_clip_manager.py') }}
          restore-keys: |
            video-cache-

      # ------------------------------------------------------------
      # CACHING: clip state (progress across runs)
      # ------------------------------------------------------------
      - name: Cache video state (clip_state.json)
        uses: actions/cache@v4
        id: state-cache
        with:
          path: clip_state.json
          key: video-state
          restore-keys: |
            video-state-

      # ------------------------------------------------------------
      # GENERATE VIDEOS
      # ------------------------------------------------------------
      - name: Generate videos
        id: generate
        run: |
          # Set the number of videos to generate
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COUNT="${{ inputs.count }}"
          else
            COUNT="2"  # Default for scheduled runs
          fi
          echo "📹 Generating $COUNT videos..."

          # Run the generation loop (cleanup after each)
          for i in $(seq 1 $COUNT); do
            echo ""
            echo "======================================"
            echo "🎬 Video $i of $COUNT"
            echo "======================================"

            python -c "from tasks import generate_video_from_reddit; result = generate_video_from_reddit(); print(result)"

            if [ $? -ne 0 ]; then
              echo "❌ Video $i failed. Stopping..."
              break
            fi

            echo "✅ Video $i done"
            echo "🧹 Cleaning up..."

            # Clean up temporary files to save disk space
            rm -rf output/caption_segments_* 2>/dev/null
            rm -f output/segment_* 2>/dev/null
            rm -f output/gameplay_segment_* 2>/dev/null
            rm -f output/audio_processed_* 2>/dev/null
            rm -f output/video_combined_* 2>/dev/null
            rm -rf cached_videos/*.mp4 2>/dev/null
            rm -rf cached_videos/*.part 2>/dev/null
            pip cache purge 2>/dev/null
            sudo apt-get clean 2>/dev/null

            df -h | grep overlay
            echo "⏳ Waiting 30 seconds before next video..."
            sleep 30
          done

          echo "✅ All videos generated"

      # ------------------------------------------------------------
      # MOVE VIDEOS TO READY FOLDER AND PUSH
      # ------------------------------------------------------------
      - name: Move videos to ready folder and push
        run: |
          echo "📦 Moving videos to videos/ready/..."

          mkdir -p videos/ready

          # Copy videos (captioned) from output folder
          cp output/*_captioned_*.mp4 videos/ready/ 2>/dev/null || cp output/*.mp4 videos/ready/ 2>/dev/null
          # Copy metadata if exists
          cp output/*_metadata.json videos/ready/ 2>/dev/null

          VIDEO_COUNT=$(ls -1 videos/ready/*.mp4 2>/dev/null | wc -l)
          echo "✅ $VIDEO_COUNT videos ready for upload"

          if [ $VIDEO_COUNT -gt 0 ]; then
            # Configure git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Add and push
            git add videos/ready/*.mp4 videos/ready/*.json
            git commit -m "Add $VIDEO_COUNT new videos (auto-generated)"
            git push origin main

            echo "✅ Push complete! Upload workflow will trigger."
          else
            echo "ℹ️ No videos to push."
          fi

      # ------------------------------------------------------------
      # CLEANUP FINAL
      # ------------------------------------------------------------
      - name: Final cleanup
        run: |
          rm -rf output/*.mp4
          rm -rf cached_videos/*.mp4
          df -h
